<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office · Dutpal AP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap"><link rel="stylesheet" href="/static/style.css">
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<style>nav{display:flex;gap:8px;padding:14px 32px;flex-wrap:wrap}nav button.on{background:var(--ink);color:var(--canvas)}main{padding:8px 32px 48px;max-width:1200px;margin:auto;display:grid;gap:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.cards .card{padding:20px}.big{font-family:"Instrument Serif",Georgia,serif;font-size:42px;line-height:1}
table{width:100%;border-collapse:collapse}th{font-weight:600;text-align:left;color:var(--muted);font-size:13px}td,th{padding:9px 8px;border-top:1px solid var(--line)}.wrap{overflow-x:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input,.row select{width:auto;flex:1;min-width:130px}.warn{background:color-mix(in srgb,var(--review) 14%,transparent);border:1px solid var(--review);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.btn.fail{color:var(--fail);border-color:var(--fail)}.approved .dot{background:var(--pass)}.red{color:var(--fail)}</style></head><body>
<div class="top"><b>Dutpal AP</b><span id="who"></span><div class="sp"></div><a class="btn" href="/reviewer" id="rv">Review queue</a><button onclick="T()">Light / dark</button><button onclick="O()">Sign out</button></div>
<nav id="nav"></nav><main id="v"></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),inr=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
function T(){const d=document.documentElement;d.dataset.theme=localStorage.theme=d.dataset.theme=="dark"?"light":"dark"}async function O(){await fetch("/api/logout",{method:"POST"});location.href="/"}
async function api(u,m,b){const r=await fetch(u,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});if(r.status==401)location.href="/";const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.detail||"Something went wrong");throw 0}return j}
const val=id=>$(id).value;let me,tab="dash",edit=false,inv=[];
const LBL={auto_pct:"Auto-approve up to (% of PO)",auto_rs:"Auto-approve up to (₹)",review_pct:"Send to review up to (% of PO)",review_rs:"Send to review up to (₹)",max_invoices_per_po:"Invoices on one PO before review",rejection_limit:"Vendor rejections before review",pending_days:"Pending review turns red after (days)",rounding:"Rounding ignored (₹)",min_confidence:"Minimum read confidence (0 to 1)",lookalike_ratio:"Lookalike name similarity (0 to 1)",late_pct_per_day:"Suggested late penalty (% per day)",late_cap_pct:"Late penalty cap (%)"};
const TXT={processing:"Checking",approved:"Approved",review:"Under review",admin_pending:"With Admin",rejected:"Rejected",reupload:"Re-upload requested",error:"Error"};
function nav(){const t=[["dash","Dashboard"],["vend","Vendors"],["po","Purchase orders"],["gr","Goods received"],["aud","Audit log"]];if(me.role=="admin")t.push(["appr","Approvals"],["set","Settings"]);
$("nav").innerHTML=t.map(x=>`<button class="${tab==x[0]?"on":""}" onclick="tab='${x[0]}';edit=false;show()">${x[1]}</button>`).join("")}
async function show(){nav();const f={dash,vend,po,gr,aud,appr,set}[tab];$("v").innerHTML=await f()}
async function dash(){const s=await api("/api/s/stats");inv=await api("/api/r/invoices");const c=s.counts,n=k=>c[k]||0;
const card=(l,v,x)=>`<div class="card"><div class="label">${l}</div><div class="big ${x||""}">${v}</div></div>`;
return `<h2 style="font-size:40px">Dashboard</h2><div class="cards">${card("Invoices",s.total)}${card("Approved",n("approved"))}${card("Needs a person",n("review")+n("admin_pending"))}${card("Rejected or re-upload",n("rejected")+n("reupload"))}${card("Average read time",s.avg_read!=null?s.avg_read+"s":"-")}</div>
<div class="cards">${card("Approved value",inr(s.amounts.approved))}${card("Held for review",inr(s.amounts.held))}${card("Blocked",inr(s.amounts.blocked))}</div>
<div class="card wrap"><div class="label">Outcomes by vendor</div><table><tr><th>Vendor</th><th>Approved</th><th>Held</th><th>Blocked</th></tr>${Object.entries(s.vendors).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.approved}</td><td>${v.held}</td><td>${v.blocked}</td></tr>`).join("")||"<tr><td colspan=4>No invoices yet</td></tr>"}</table></div>
<div class="card wrap"><div class="row" style="margin-bottom:12px"><div class="label" style="flex:1 0 100%">History</div><input id="q" placeholder="Search invoice or vendor" oninput="hist()"><select id="fs" onchange="hist()"><option value="">All statuses</option>${Object.keys(TXT).map(k=>`<option value="${k}">${TXT[k]}</option>`).join("")}</select></div><table id="ht"></table></div>`}
function hist(){const t=val("q").toLowerCase(),s=val("fs");$("ht").innerHTML="<tr><th>Invoice</th><th>Vendor</th><th>Status</th><th>Risk</th><th>Amount</th><th>Uploaded</th></tr>"+inv.filter(i=>(!s||i.status==s)&&(!t||(i.vendor+" "+(i.invoice_no||i.filename)).toLowerCase().includes(t))).map(i=>`<tr><td>${esc(i.invoice_no||i.filename)}</td><td>${esc(i.vendor)}</td><td class="${i.overdue?"red":""}">${TXT[i.status]}${i.overdue?" · "+i.age+" days":""}</td><td>${i.risk||""}</td><td>${i.total?inr(i.total):""}</td><td>${i.created.replace("T"," ")}</td></tr>`).join("")}
async function vend(){const [V,C]=await Promise.all([api("/api/s/vendors"),api("/api/s/changes")]);
return `<h2 style="font-size:40px">Approved vendors</h2>${C.length?`<div class="warn"><b>Bank changes waiting for the Admin</b>${C.map(c=>`<div>${esc(c.vendor)}: ${esc(c.old)} → ${esc(c.new)}, asked by ${esc(c.by)}</div>`).join("")}</div>`:""}
<div class="card wrap"><table><tr><th>Vendor</th><th>GSTIN</th><th>Bank on file</th><th></th></tr>${V.map(v=>`<tr><td>${esc(v.name)}</td><td>${v.gstin}</td><td>${esc(v.bank_name)} ${v.account} · ${v.ifsc}</td><td><button class="btn fail" onclick="rm('${v.id}')">Remove</button></td></tr>`).join("")}</table></div>
<div class="card" style="display:grid;gap:12px"><div class="label">Add a vendor</div><div class="row"><input id="n" placeholder="Company name"><input id="g" placeholder="GSTIN"><input id="b" placeholder="Bank name"><input id="a" placeholder="Account number"><input id="i" placeholder="IFSC"></div><div><button class="btn pri" onclick="add()">Add vendor</button></div></div>
<div class="card" style="display:grid;gap:12px"><div class="label">Change a vendor's bank details (the Admin must approve)</div><div class="row"><select id="cv">${V.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("")}</select><input id="cb" placeholder="Bank name"><input id="ca" placeholder="Account number"><input id="ci" placeholder="IFSC"></div><div><button class="btn pri" onclick="bank()">Send for approval</button></div></div>`}
async function add(){await api("/api/s/vendors","POST",{name:val("n"),gstin:val("g"),bank_name:val("b"),account:val("a"),ifsc:val("i")});show()}
async function rm(id){if(confirm("Remove this vendor? New invoices from them will be rejected."))await api(`/api/s/vendors/${id}/remove`,"POST");show()}
async function bank(){await api(`/api/s/vendors/${val("cv")}/bank`,"POST",{bank_name:val("cb"),account:val("ca"),ifsc:val("ci")});alert("Sent to the Admin for approval");show()}
async function po(){const [P,V]=await Promise.all([api("/api/s/pos"),api("/api/s/vendors")]);
return `<h2 style="font-size:40px">Purchase orders</h2><p style="color:var(--muted);max-width:62ch">The company's PO records. Invoices are matched against these. Add a new PO here, with no code changes.</p>
<div class="card wrap"><table><tr><th>PO</th><th>Vendor</th><th>Items</th><th>Total</th><th>Promised by</th><th>Status</th></tr>${P.map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.vendor)}</td><td>${p.lines.map(l=>esc(l.item)+" × "+l.qty+" @ "+inr(l.price)).join("<br>")}</td><td>${inr(p.total)}</td><td>${p.promised}</td><td><select onchange="pst('${p.no}',this.value)" style="width:auto">${["open","closed","cancelled"].map(s=>`<option ${s==p.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>
<div class="card" style="display:grid;gap:12px"><div class="label">Add a purchase order</div><div class="row"><input id="pn" placeholder="PO number"><select id="pv">${V.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("")}</select><input id="pi" placeholder="Item"><input id="pq" type="number" placeholder="Quantity"><input id="pp" type="number" placeholder="Price per unit (₹)"></div>
<div class="row"><label>Order date <input id="pd" type="date"></label><label>Promised by <input id="pr" type="date"></label></div><div><button class="btn pri" onclick="addpo()">Add PO</button></div></div>`}
async function addpo(){await api("/api/s/pos","POST",{no:val("pn"),vendor_id:val("pv"),item:val("pi"),qty:val("pq"),price:val("pp"),date:val("pd"),promised:val("pr")});show()}
async function pst(no,s){await api(`/api/s/pos/${no}/status`,"POST",{status:s});show()}
async function gr(){const [G,P]=await Promise.all([api("/api/s/grn"),api("/api/s/pos")]);
return `<h2 style="font-size:40px">Goods received</h2><p style="color:var(--muted);max-width:62ch">What the warehouse actually received. Invoices are paid only for what is recorded here.</p>
<div class="card wrap"><table><tr><th>PO</th><th>Item</th><th>Received</th><th>Rejected</th><th>Delivered</th></tr>${G.map(g=>`<tr><td>${esc(g.po)}</td><td>${esc(g.item)}</td><td>${g.received}</td><td>${g.rejected}</td><td>${g.delivered}</td></tr>`).join("")}</table></div>
<div class="card" style="display:grid;gap:12px"><div class="label">Record a delivery</div><div class="row"><select id="gp">${P.map(p=>`<option value="${esc(p.no)}">${esc(p.no)} · ${esc(p.vendor)} · ${esc(p.lines[0].item)}</option>`).join("")}</select><input id="gi" placeholder="Item (exactly as on the PO)"><input id="ga" type="number" placeholder="Received"><input id="gj" type="number" placeholder="Rejected (0 if none)"><label>Delivered on <input id="gd" type="date"></label></div><div><button class="btn pri" onclick="addgr()">Save delivery</button></div></div>`}
async function addgr(){await api("/api/s/grn","POST",{po:val("gp"),item:val("gi"),received:val("ga"),rejected:val("gj"),delivered:val("gd")});show()}
async function aud(){const A=await api("/api/s/audit");return `<h2 style="font-size:40px">Audit log</h2><p style="color:var(--muted)">Every login, upload, decision and change. It is append-only and cannot be edited or deleted.</p><div class="card wrap"><table><tr><th>Time</th><th>Who</th><th>What</th><th>Invoice</th><th>Details</th></tr>${A.map(a=>`<tr><td>${a.ts.replace("T"," ")}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.invoice_id)}</td><td>${esc(a.detail)}</td></tr>`).join("")}</table></div>`}
async function appr(){const [I,C]=await Promise.all([api("/api/a/pending-invoices"),api("/api/s/changes")]);
return `<h2 style="font-size:40px">Waiting for your approval</h2>${I.map(i=>`<div class="warn"><b>${esc(i.vendor)} · ${esc(i.invoice_no)} · ${inr(i.total)}</b><span>${esc(i.summary)}</span><div class="row"><button class="btn pri" onclick="ai('${i.id}','approve')">Approve payment</button><button class="btn fail" onclick="ai('${i.id}','decline')">Decline</button></div></div>`).join("")||"<p style='color:var(--muted)'>No invoices waiting.</p>"}
<div class="label">Vendor bank changes</div>${C.map(c=>`<div class="warn"><b>${esc(c.vendor)}</b><span>${esc(c.old)} → ${esc(c.new)}, asked by ${esc(c.by)}</span><div class="row"><button class="btn pri" onclick="ac('${c.id}','approve')">Approve</button><button class="btn fail" onclick="ac('${c.id}','decline')">Decline</button></div></div>`).join("")||"<p style='color:var(--muted)'>No bank changes waiting.</p>"}`}
async function ai(id,a){await api("/api/a/invoice/"+id,"POST",{action:a,note:prompt("Note (optional)")||""});show()}async function ac(id,a){await api("/api/a/change/"+id,"POST",{action:a});show()}
async function set(){const S=await api("/api/s/settings"),A=(await api("/api/s/audit")).filter(a=>a.action=="setting").slice(0,8);
return `<h2 style="font-size:40px">Thresholds, ${edit?"unlocked":"locked"}</h2><p style="color:var(--muted);max-width:60ch">Set once at first setup. Changing them needs this Admin login, and every change is written to a history that cannot be deleted.</p>
<div class="card"><table>${Object.keys(LBL).map(k=>`<tr><td>${LBL[k]}</td><td style="text-align:right">${edit?`<input id="s_${k}" value="${S[k]}" style="width:110px">`:`<b>${S[k]}</b> <span class="label">Locked</span>`}</td></tr>`).join("")}</table>
<div class="row" style="margin-top:16px">${edit?`<input id="why" placeholder="Reason for this change (required)"><button class="btn pri" onclick="save()">Save</button><button class="btn" onclick="edit=false;show()">Cancel</button>`:`<button class="btn pri" onclick="edit=true;show()">Change a threshold</button><button class="btn" onclick="rst()">Reload demo data</button>`}</div></div>
<div class="card"><div class="label">Change history</div>${A.map(a=>`<div style="padding:8px 0;border-top:1px solid var(--line)">${a.ts.replace("T"," ")} · ${esc(a.actor)} · ${esc(a.detail)}</div>`).join("")||"<p style='color:var(--muted)'>No changes yet.</p>"}</div>`}
async function save(){const ch={};for(const k in LBL)ch[k]=val("s_"+k);await api("/api/a/settings","POST",{changes:ch,reason:val("why")});edit=false;show()}
async function rst(){if(confirm("Clear all invoices and restore the demo vendors and settings? The audit log is kept."))await api("/api/a/reset","POST");show()}
api("/api/me").then(u=>{me=u;$("who").textContent=u.name;if(u.role=="admin")$("rv").style.display="none";tab=u.role=="admin"?"appr":"dash";show()});
</script></body></html>
